services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apex}
      POSTGRES_DB: ${POSTGRES_DB:-apex_tracker}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:-apex}@db:5432/${POSTGRES_DB:-apex_tracker}
      TRACKER_API_KEY: ${TRACKER_API_KEY}
      ACCOUNTS: ${ACCOUNTS}
    depends_on:
      db:
        condition: service_healthy

  poller:
    build:
      context: .
      target: poller
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:-apex}@db:5432/${POSTGRES_DB:-apex_tracker}
      TRACKER_API_KEY: ${TRACKER_API_KEY}
      ACCOUNTS: ${ACCOUNTS}
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-15}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
