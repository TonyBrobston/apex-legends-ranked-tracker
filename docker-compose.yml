services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - apex.env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - apex.env
    depends_on:
      db:
        condition: service_healthy

  poller:
    build:
      context: .
      target: poller
    restart: unless-stopped
    env_file:
      - apex.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
